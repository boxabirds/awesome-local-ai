<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story review</title>
<style>
:root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --card:#fff; --sel:#eef2ff;
        --pass:#1f7a3f; --fail:#b3261e; --skip:#9a6700; --accent:#2f5bd3; --chip:#efeee8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
        --bg:#161615; --fg:#ecebe6; --muted:#9b9a94; --line:#2d2d2a; --card:#1e1e1c; --sel:#232a44;
        --pass:#5cc47f; --fail:#f07167; --skip:#e3b341; --accent:#8aa8ff; --chip:#2a2a27; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
header b { font-size:15px; } .muted { color:var(--muted); } .small { font-size:12px; }
.layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 42px); }
@media (max-width:860px) { .layout { grid-template-columns:1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } }
nav { border-right:1px solid var(--line); padding:8px 0; }
nav a { display:flex; justify-content:space-between; gap:8px; padding:6px 16px; color:var(--fg); text-decoration:none; }
nav a.on { background:var(--sel); font-weight:600; } nav a .n { color:var(--muted); font-size:12px; white-space:nowrap; }
nav a .n.done { color:var(--pass); }
main { padding:12px 16px 40px; max-width:1100px; min-width:0; }
h1 { font-size:19px; margin:4px 0; }
.summary { color:var(--muted); margin-bottom:10px; }
.spec { display:grid; grid-template-columns:1.2fr 1fr; gap:12px; }
@media (max-width:860px) { .spec { grid-template-columns:1fr; } }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
ol, ul { margin:0; padding-left:20px; } li { margin:2px 0; }
.reqs { columns:2; column-gap:18px; } @media (max-width:860px) { .reqs { columns:1; } }
.builds { margin-top:14px; }
.build { display:grid; grid-template-columns:28px minmax(120px,220px) 150px auto 1fr; gap:10px; align-items:start; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); margin-bottom:6px; }
@media (max-width:860px) { .build { grid-template-columns:28px 1fr; } .build > :nth-child(n+3) { grid-column:2; } }
.build.on { outline:2px solid var(--accent); }
.key { font:600 13px ui-monospace, Menlo, monospace; color:var(--muted); padding-top:4px; }
.name { font-weight:600; padding-top:3px; word-break:break-word; }
.status { font-size:12px; color:var(--muted); padding-top:5px; }
.status.running { color:var(--pass); } .status.failed { color:var(--fail); }
button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:3px 9px; cursor:pointer; font:inherit; }
.verdicts { display:flex; gap:4px; flex-wrap:wrap; }
.verdicts .pass.on { background:var(--pass); color:#fff; } .verdicts .fail.on { background:var(--fail); color:#fff; } .verdicts .skip.on { background:var(--skip); color:#fff; }
textarea { width:100%; min-height:34px; resize:vertical; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; }
.keys { margin-top:14px; color:var(--muted); font-size:12px; }
kbd { background:var(--chip); border-radius:3px; padding:0 4px; font:11px ui-monospace, monospace; }
.reveal { margin-top:8px; }
</style>
</head>
<body>
<header>
  <b>Story review</b>
  <span id="mode" class="muted"></span>
  <span id="progress" class="muted"></span>
  <span id="saved" class="muted small"></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main">Loading…</main>
</div>
<script>
let S = null, story = 0, sel = 0, status = {};
const drafts = {};  // "story:key" -> note text typed but not yet saved; never lost to a redraw
const NOTE_SAVE_MS = 700;
const timers = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const review = (sid, key) => S.reviews.find(r => r.story === sid && r.key === key);

function counts(sid) { return S.builds.filter(b => review(sid, b.key)?.verdict).length; }

function renderNav() {
  const n = S.builds.length;
  $("nav").innerHTML = S.stories.map((s, i) => {
    const c = counts(s.id);
    return `<a href="#" data-i="${i}" class="${i === story ? "on" : ""}"><span>${s.id}. ${esc(s.title)}</span><span class="n ${c === n ? "done" : ""}">${c}/${n}</span></a>`;
  }).join("");
  document.querySelectorAll("nav a").forEach(a => a.onclick = e => { e.preventDefault(); go(+a.dataset.i); });
  const total = S.stories.length * n, done = S.stories.reduce((t, s) => t + counts(s.id), 0);
  $("progress").textContent = `${done} of ${total} story × build reviews done`;
}

function statusText(key) {
  const st = status[key];
  if (!st) return ["not started", ""];
  if (st.state === "running") return ["running", "running"];
  if (st.state === "ready") return ["ready: opens in seconds", "running"];
  if (st.state === "queued") return ["queued to build", ""];
  if (st.state === "preparing") return [st.step || "preparing…", ""];
  if (st.state === "failed") return ["failed: " + (st.error || "").slice(0, 80), "failed"];
  return [st.state, ""];
}

function renderBuilds() {
  const sid = S.stories[story].id;
  $("builds").innerHTML = S.builds.map((b, i) => {
    const r = review(sid, b.key) || {}, [st, cls] = statusText(b.key);
    const note = drafts[`${sid}:${b.key}`] ?? r.notes ?? "";
    return `<div class="build ${i === sel ? "on" : ""}" data-i="${i}">
      <div class="key">${i + 1}</div>
      <div class="name">${esc(b.label)}</div>
      <div><button data-open="${i}">${status[b.key]?.state === "running" ? "Go to tab" : "Open"}</button><div class="status ${cls}">${esc(st)}</div></div>
      <div class="verdicts">${["pass", "fail", "skip"].map(v => `<button class="${v} ${r.verdict === v ? "on" : ""}" data-v="${v}" data-i="${i}">${v}</button>`).join("")}</div>
      <textarea data-note="${i}" placeholder="what works, what doesn't, questions, scope…">${esc(note)}</textarea>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { sel = +b.dataset.open; openTab(sel); });
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { sel = +b.dataset.i; setVerdict(b.dataset.v, false); });
  document.querySelectorAll("[data-note]").forEach(t => {
    t.onfocus = () => { sel = +t.dataset.note; document.querySelectorAll(".build").forEach((el, j) => el.classList.toggle("on", j === sel)); };
    t.oninput = () => {
      const i = +t.dataset.note, id = `${S.stories[story].id}:${S.builds[i].key}`;
      drafts[id] = t.value;
      clearTimeout(timers[id]);
      timers[id] = setTimeout(() => saveNote(i, t.value), NOTE_SAVE_MS);  // saved as you type
    };
    t.onblur = () => saveNote(+t.dataset.note, t.value);
  });
  const all = S.builds.every(b => review(sid, b.key)?.verdict);
  $("reveal").innerHTML = S.blind ? (all ? `<button id="rv">Reveal which build is which (story ${sid})</button> <span id="rvout" class="small"></span>` : `<span class="muted small">Names are revealed for this story once every build has a verdict.</span>`) : "";
  if ($("rv")) $("rv").onclick = reveal;
}

function renderStory() {
  const s = S.stories[story];
  $("main").innerHTML = `
    <h1>Story ${s.id}: ${esc(s.title)}</h1>
    <div class="summary">${esc(s.summary)}</div>
    <div class="spec">
      <section><h2>Golden path: do this in each build</h2><ol>${s.golden_path.map(g => `<li>${esc(g)}</li>`).join("")}</ol></section>
      <section><h2>Must not</h2>${s.non_behaviours.length ? `<ul>${s.non_behaviours.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : `<span class="muted">nothing listed</span>`}</section>
    </div>
    <section style="margin-top:12px"><h2>Also required (${s.requirements.length})</h2><ul class="reqs">${s.requirements.map(r => `<li>${esc(r.title)}</li>`).join("")}</ul></section>
    <div class="builds" id="builds"></div>
    <div class="reveal" id="reveal"></div>
    <div class="keys"><kbd>1</kbd>–<kbd>9</kbd> pick a build · <kbd>o</kbd> open or go to its tab · <kbd>+</kbd> pass · <kbd>-</kbd> fail · <kbd>space</kbd> skip · <kbd>n</kbd> note (<kbd>Esc</kbd> to leave) · <kbd>↑</kbd><kbd>↓</kbd> build · <kbd>←</kbd><kbd>→</kbd> story<br>
    Each build opens <b>as it was after story ${s.id}</b>, built from that story's commit; moving to another story stops these builds. Reviews save to <code>${esc(S.file)}</code>.</div>`;
  renderBuilds();
}

async function go(i) {
  story = Math.max(0, Math.min(i, S.stories.length - 1)); sel = firstUnreviewed();
  // Each story is reviewed on the build as it was after that story: the server stops other stories' builds.
  await fetch(`/api/review/story/${S.stories[story].id}`, {method: "POST"});
  status = {}; await poll();
  renderNav(); renderStory();
}
function firstUnreviewed() { const sid = S.stories[story].id; const k = S.builds.findIndex(b => !review(sid, b.key)?.verdict); return k < 0 ? 0 : k; }

async function openTab(i) {
  const key = S.builds[i].key;
  const sid = S.stories[story].id, name = `vidi-build-${key}`;  // one tab per build, reused across stories
  if (status[key]?.state === "running") { window.open(status[key].url, name); return; }
  const w = window.open("about:blank", name);  // open now, while this is still a user action
  const st = await (await fetch(`/api/review/open/${sid}/${key}`, {method: "POST"})).json();
  status[key] = st; renderBuilds();
  const wait = async () => {
    await poll();
    if (status[key]?.state === "running") { if (w) w.location = status[key].url; }
    else if (status[key]?.state !== "failed") setTimeout(wait, 1500);
  };
  wait();
}

async function post(key, verdict, notes) {
  const sid = S.stories[story].id;
  const r = await fetch("/api/review/set", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({story: sid, key, verdict, notes})});
  if (!r.ok) { $("saved").textContent = "NOT SAVED: " + (await r.text()); return false; }
  const row = review(sid, key);
  if (row) { row.verdict = verdict; row.notes = notes; } else S.reviews.push({story: sid, key, verdict, notes});
  if (drafts[`${sid}:${key}`] === notes) delete drafts[`${sid}:${key}`];
  $("saved").textContent = "saved " + new Date().toLocaleTimeString();
  return true;
}

async function setVerdict(v, advance = true) {
  const key = S.builds[sel].key, sid = S.stories[story].id;
  const note = drafts[`${sid}:${key}`] ?? review(sid, key)?.notes ?? "";
  if (!(await post(key, v, note))) return;
  if (advance) { const k = firstUnreviewed(); if (k !== sel) sel = k; }
  renderNav(); renderBuilds();
}

async function saveNote(i, text) {
  const key = S.builds[i].key, r = review(S.stories[story].id, key);
  if ((r?.notes || "") !== text) await post(key, r?.verdict || "", text);
}

async function reveal() {
  const r = await fetch(`/api/review/reveal/${S.stories[story].id}`);
  const d = await r.json();
  $("rvout").textContent = r.ok ? d.map(x => `${String.fromCharCode(65 + x.key)} = ${x.setup} ${x.run}`).join(" · ") : d.error;
}

async function poll() {
  const sid = S.stories[story].id;
  for (const s of await (await fetch(`/api/review/status/${sid}`)).json()) status[s.key] = s.status;
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, n = S.builds.length;
  if (/^[1-9]$/.test(k) && +k <= n) { sel = +k - 1; renderBuilds(); }
  else if (k === "o") openTab(sel);
  else if (k === "+" || k === "=") setVerdict("pass");
  else if (k === "-") setVerdict("fail");
  else if (k === " ") { e.preventDefault(); setVerdict("skip"); }
  else if (k === "n") { e.preventDefault(); document.querySelector(`[data-note="${sel}"]`)?.focus(); }
  else if (k === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, n - 1); renderBuilds(); }
  else if (k === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); renderBuilds(); }
  else if (k === "ArrowRight") go(story + 1);
  else if (k === "ArrowLeft") go(story - 1);
});

(async () => {
  S = await (await fetch("/api/review/state")).json();
  $("mode").textContent = `${S.builds.length} builds · ${S.blind ? "blind (letters are shuffled each session)" : "labelled"}`;
  await go(0);
  setInterval(async () => { await poll(); if (document.activeElement?.tagName !== "TEXTAREA") renderBuilds(); }, 3000);
})();
</script>
</body>
</html>
