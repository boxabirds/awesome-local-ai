<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story review</title>
<style>
:root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --card:#fff; --sel:#eef2ff;
        --pass:#1f7a3f; --fail:#b3261e; --skip:#9a6700; --accent:#2f5bd3; --chip:#efeee8; --stage:#e9e8e2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
        --bg:#161615; --fg:#ecebe6; --muted:#9b9a94; --line:#2d2d2a; --card:#1e1e1c; --sel:#232a44;
        --pass:#5cc47f; --fail:#f07167; --skip:#e3b341; --accent:#8aa8ff; --chip:#2a2a27; --stage:#111110; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
header { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
header b { font-size:15px; } .muted { color:var(--muted); } .small { font-size:12px; }
.layout { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:calc(100vh - 42px); }
@media (max-width:860px) { .layout { grid-template-columns:1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } }
nav { border-right:1px solid var(--line); padding:8px 0; }
nav a { display:flex; justify-content:space-between; gap:8px; padding:6px 14px; color:var(--fg); text-decoration:none; }
nav a.on { background:var(--sel); font-weight:600; } nav a .n { color:var(--muted); font-size:12px; white-space:nowrap; }
nav a .n.done { color:var(--pass); }
main { padding:12px 16px 40px; min-width:0; }
h1 { font-size:19px; margin:4px 0; }
.summary { color:var(--muted); margin-bottom:10px; }
.spec { display:grid; grid-template-columns:1.2fr 1fr; gap:12px; }
@media (max-width:860px) { .spec { grid-template-columns:1fr; } }
section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
ol, ul { margin:0; padding-left:20px; } li { margin:2px 0; }
details > summary { cursor:pointer; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
.work { display:grid; grid-template-columns:minmax(300px, 420px) minmax(0,1fr); gap:12px; margin-top:12px; align-items:start; }
@media (max-width:1100px) { .work { grid-template-columns:1fr; } }
.build { border:1px solid var(--line); border-radius:8px; background:var(--card); margin-bottom:8px; padding:6px 8px; }
.bhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.bhead .name { font-weight:600; } .bhead .status { font-size:12px; color:var(--muted); }
.bhead .status.running { color:var(--pass); } .bhead .status.failed { color:var(--fail); }
.bsum { font-size:12px; color:var(--muted); margin-left:auto; }
.prow { display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:6px; align-items:center; padding:3px 4px; border-radius:6px; cursor:pointer; }
.prow:hover { background:var(--chip); } .prow.on { background:var(--sel); outline:1px solid var(--accent); }
.prow .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.mark { font-size:11px; border-radius:9px; padding:0 6px; white-space:nowrap; }
.mark.agree { background:var(--pass); color:#fff; } .mark.disagree { background:var(--fail); color:#fff; } .mark.skip { background:var(--skip); color:#fff; } .mark.todo { color:var(--muted); }
button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:3px 9px; cursor:pointer; font:inherit; }
button:disabled { opacity:.5; cursor:default; } button.on { outline:2px solid var(--accent); }
.pill { font-size:11px; border-radius:9px; padding:0 6px; text-align:center; background:var(--chip); }
.pill.passed { color:var(--pass); } .pill.failed, .pill.timedOut { color:var(--fail); }
#player { position:sticky; top:52px; }
.phead { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.auto { font-weight:700; font-size:15px; } .auto.passed { color:var(--pass); } .auto.failed, .auto.timedOut { color:var(--fail); }
.req { margin:6px 0; padding:6px 8px; border-left:3px solid var(--accent); background:var(--bg); border-radius:4px; font-size:13px; white-space:pre-wrap; }
.stage { display:flex; gap:8px; background:var(--stage); border-radius:6px; padding:6px; margin-top:6px; }
.pane { flex:1 1 0; min-width:0; } .pane .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
.pane .screen { position:relative; width:100%; background:var(--card); border-radius:4px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
.pane img { width:100%; display:block; }
.controls { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; font-size:12px; }
.seek { position:relative; height:26px; touch-action:none; user-select:none; background:var(--chip); border-radius:4px; margin-top:6px; cursor:pointer; }
.seek .tick { position:absolute; top:3px; bottom:3px; width:3px; margin-left:-1px; border-radius:1px; cursor:pointer; }
.seek .tick.ok { background:var(--pass); } .seek .tick.bad { background:var(--fail); width:5px; margin-left:-2px; }
.seek .tick.act { background:var(--muted); opacity:.35; top:9px; bottom:9px; width:2px; }
.seek .wait { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg, transparent 0 4px, var(--line) 4px 6px); }
.seek .head { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--accent); }
.pbody { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr); gap:10px; margin-top:6px; }
@media (max-width:1300px) { .pbody { grid-template-columns:1fr; } }
.steps { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:6px; font-size:12px; }
.step { display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:6px; padding:2px 6px; cursor:pointer; border-bottom:1px solid var(--line); }
.step:hover { background:var(--chip); } .step.cur { background:var(--sel); }
.step.act, .step.wait { color:var(--muted); } .step.check { font-weight:600; }
.step .ok { color:var(--pass); } .step .bad { color:var(--fail); }
.step .err { grid-column:2 / -1; color:var(--fail); font-weight:400; white-space:pre-wrap; }
.verdict { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.verdict .agree.on { background:var(--pass); color:#fff; } .verdict .disagree.on { background:var(--fail); color:#fff; } .verdict .skip.on { background:var(--skip); color:#fff; }
.verdict input { flex:1 1 200px; min-width:0; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:3px 7px; font:inherit; }
table { border-collapse:collapse; width:100%; font-size:12px; } td, th { border-bottom:1px solid var(--line); padding:2px 4px; text-align:left; vertical-align:top; }
.st-verified, .st-committed { color:var(--pass); } .st-not-started, .st-written { color:var(--skip); }
.keys { margin-top:14px; color:var(--muted); font-size:12px; }
kbd { background:var(--chip); border-radius:3px; padding:0 4px; font:11px ui-monospace, monospace; }
.reveal { margin-top:8px; }
.fail { color:var(--fail); }
a { color:var(--accent); }
#nav:focus-visible, #builds:focus-visible, #steps:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
#nav:focus, #builds:focus, #steps:focus { outline-color:var(--accent); }
#help { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:10; }
.helpbox { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; max-height:90vh; overflow:auto; min-width:min(520px, 92vw); }
.helpbox h2 { margin:0 0 8px; font-size:15px; } .helpbox td { padding:3px 8px; border:0; font-size:13px; } .helpbox td:first-child { white-space:nowrap; }
</style>
</head>
<body>
<header>
  <b>Story review</b>
  <span id="mode" class="muted"></span>
  <span id="progress" class="muted"></span>
  <span id="saved" class="muted small"></span>
</header>
<div class="layout">
  <nav id="nav" tabindex="0" aria-label="Stories"></nav>
  <main id="main">Loading…</main>
</div>
<script src="/review/player.js"></script>
<script>
let S = null, story = 0, status = {};
// ?setup=…&run=… (the benchmarker's Judge link): judge that one build; null shows every build.
let focus = null;
// The pane with the keyboard: "stories", "tests" (a story's held-out tests) or "steps" (the browser steps
// of the test being played). keyAction (player.js) reads keys by pane; the focused pane shows a ring.
let pane = "stories";
const paneEl = p => ({stories: $("nav"), tests: $("builds"), steps: $("steps")})[p];
function focusPane() {
  const el = paneEl(pane);
  if (el && !el.contains(document.activeElement)) el.focus({preventScroll: true});
}
document.addEventListener("focusin", e => {
  const p = e.target.closest?.("#nav") ? "stories" : e.target.closest?.("#builds") ? "tests" : e.target.closest?.("#steps") ? "steps" : null;
  if (p) pane = p;
});
const builds = () => focus === null ? S.builds : S.builds.filter(b => b.key === focus);
let cur = null;  // the selected path: {key, idx}
const NOTE_SAVE_MS = 700, POLL_MS = 3000;
const FOCUS_TRIES = 20, FOCUS_RETRY_MS = 5000;  // how long a Judge link waits for its run to join the review
const SPEEDS = [0.1, 0.25, 1, 2, 4, 8];
const MIN_PLAY_MS = 8000;         // a path plays for at least this long by default: fast tests slow down
const FRAME_FETCHES = 6;          // frames fetched at once when a path opens
const LONG_WAIT_MS = 2000;       // a timed wait longer than this is skipped in playback and drawn compressed
const WAIT_SHOWN_MS = 400;       // how much seek-bar time a skipped wait keeps
const EPS_MS = 0.5;
const timers = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const review = (sid, key, path = "") => S.reviews.find(r => r.story === sid && r.key === key && (r.path || "") === path);
const pathsCache = {};  // "story:key" -> {state, paths}
const tasksCache = {};  // "story:key" -> tasks response
const shortTitle = t => t.replace(/\s*@\S+.*$/, "");
// "… @ref prd:a prd:b": every PRD requirement the test names.
const anchorsOf = t => [...((t.split("@ref")[1] || "").matchAll(/prd:(\S+)/g))].map(m => m[1]);
const sidNow = () => S.stories[story].id;

// ---------- verdicts ----------
function paths(sid, key) { return pathsCache[`${sid}:${key}`]?.paths || []; }
function buildDone(sid, key) {
  const ps = paths(sid, key);
  return ps.length ? ps.every(p => review(sid, key, p.title)?.verdict) : !!review(sid, key)?.verdict;
}
function buildSummary(sid, key) {
  const ps = paths(sid, key);
  if (!ps.length) return pathsCache[`${sid}:${key}`] ? (review(sid, key)?.verdict || "not recorded") : "…";
  const c = {agree: 0, disagree: 0, skip: 0};
  ps.forEach(p => { const v = review(sid, key, p.title)?.verdict; if (v in c) c[v]++; });
  const todo = ps.length - c.agree - c.disagree - c.skip;
  return [c.agree && `${c.agree} agree`, c.disagree && `${c.disagree} disagree`, c.skip && `${c.skip} skipped`, todo && `${todo} to review`].filter(Boolean).join(" · ");
}
function counts(sid) { return builds().filter(b => buildDone(sid, b.key)).length; }

function renderNav() {
  const n = builds().length;
  $("nav").innerHTML = S.stories.map((s, i) => {
    const c = counts(s.id);
    return `<a href="#" data-i="${i}" class="${i === story ? "on" : ""}"><span>${s.id}. ${esc(s.title)}</span><span class="n ${c === n ? "done" : ""}">${c}/${n}</span></a>`;
  }).join("");
  document.querySelectorAll("nav a").forEach(a => { a.tabIndex = -1; a.onclick = e => { e.preventDefault(); go(+a.dataset.i); }; });
  const sid = sidNow();
  let total = 0, done = 0;
  builds().forEach(b => paths(sid, b.key).forEach(p => { total++; if (review(sid, b.key, p.title)?.verdict) done++; }));
  $("progress").textContent = `story ${sid}: ${done} of ${total} paths judged`;
}

function statusText(key) {
  const st = status[key];
  if (!st) return ["not started", ""];
  if (st.state === "running") return ["running", "running"];
  if (st.state === "ready") return ["ready", "running"];
  if (st.state === "queued") return ["queued to build", ""];
  if (st.state === "preparing") return [st.step || "preparing…", ""];
  if (st.state === "failed") return ["failed: " + (st.error || "").slice(0, 80), "failed"];
  return [st.state, ""];
}

function renderBuilds() {
  const sid = sidNow();
  $("builds").innerHTML = builds().map((b, i) => {
    const [st, cls] = statusText(b.key), ps = paths(sid, b.key);
    const rows = ps.map((p, j) => {
      const v = review(sid, b.key, p.title)?.verdict || "";
      const on = cur && cur.key === b.key && cur.idx === j;
      return `<div class="prow ${on ? "on" : ""}" data-key="${b.key}" data-idx="${j}">
        <span class="pill ${esc(p.status)}">${esc(p.status)}</span>
        <span class="t" title="${esc(p.title)}">${esc(shortTitle(p.title))}</span>
        <span class="mark ${v || "todo"}">${v || "to review"}</span></div>`;
    }).join("");
    const noPaths = !ps.length ? `<div class="small muted">no recorded paths (${esc(pathsCache[`${sid}:${b.key}`]?.state || "loading")}); verdict on the build itself:
        ${["pass", "fail", "skip"].map(v => `<button data-bv="${v}" data-key="${b.key}" class="${review(sid, b.key)?.verdict === v ? "on" : ""}">${v}</button>`).join(" ")}</div>` : "";
    return `<div class="build">
      <div class="bhead"><span class="muted small">${i + 1}</span><span class="name">${esc(b.label)}</span>
        <button data-open="${b.key}">${status[b.key]?.state === "running" ? "Go to tab" : "Open"}</button>
        <span class="status ${cls}">${esc(st)}</span><span class="bsum">${esc(buildSummary(sid, b.key))}</span></div>
      ${rows}${noPaths}</div>`;
  }).join("");
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = e => { e.stopPropagation(); openTab(+b.dataset.open); });
  document.querySelectorAll(".prow").forEach(r => r.onclick = () => select(+r.dataset.key, +r.dataset.idx));
  document.querySelectorAll("[data-bv]").forEach(b => b.onclick = () => post(+b.dataset.key, b.dataset.bv, review(sid, +b.dataset.key)?.notes || "", "").then(() => { renderNav(); renderBuilds(); renderReveal(); }));
  renderReveal();
  focusPane();
}

function renderReveal() {
  const sid = sidNow();
  const all = S.builds.every(b => buildDone(sid, b.key)); // reveal needs every build, focused or not
  $("reveal").innerHTML = S.blind ? (all ? `<button id="rv">Reveal which build is which (story ${sid})</button> <span id="rvout" class="small"></span>` : `<span class="muted small">Names are revealed for this story once every path of every build has a verdict.</span>`) : "";
  if ($("rv")) $("rv").onclick = reveal;
}

async function loadPaths() {
  const sid = sidNow();
  await Promise.all(builds().map(async b => {
    const k = `${sid}:${b.key}`, c = pathsCache[k];
    if (c && c.state === "done") return;  // finished recordings don't change
    pathsCache[k] = await (await fetch(`/api/review/paths/${sid}/${b.key}`)).json();
  }));
}

function renderStory() {
  const s = S.stories[story];
  $("main").innerHTML = `
    <h1>Story ${s.id}: ${esc(s.title)}</h1>
    <div class="summary">${esc(s.summary)}</div>
    ${s.prerequisites.length ? `<div class="summary"><b>First:</b> ${s.prerequisites.map(id => { const p = S.stories.find(x => x.id === id); return esc(p ? p.title : "story " + id); }).join(", then ")}. Reviewed on the build after story ${s.review_build}, the first that has all of it.</div>` : ""}
    <details><summary>Golden path, must-nots and requirements</summary>
    <div class="spec" style="margin-top:6px">
      <section><h2>Golden path</h2><ol>${s.golden_path.map(g => `<li>${esc(g)}</li>`).join("")}</ol></section>
      <section><h2>Must not</h2>${s.non_behaviours.length ? `<ul>${s.non_behaviours.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : `<span class="muted">nothing listed</span>`}</section>
    </div>
    <section style="margin-top:8px"><h2>Requirements (${s.requirements.length})</h2><ul>${s.requirements.map(r => `<li><b>${esc(r.title)}</b> <span class="muted small">${esc(r.anchor)}</span></li>`).join("")}</ul></section>
    </details>
    <div class="work"><div><div id="builds" tabindex="0" aria-label="Held-out tests"></div><div class="reveal" id="reveal"></div></div><div id="player"><section class="muted">Pick a path on the left (or press <kbd>j</kbd>) to play its recording.</section></div></div>
    <div class="keys"><kbd>Tab</kbd> / <kbd>⇧Tab</kbd> move between stories, held-out tests and browser steps · <kbd>↑</kbd><kbd>↓</kbd> within one · <kbd>←</kbd><kbd>→</kbd> scrub · <kbd>Space</kbd> play · <kbd>Return</kbd> agree and next · <kbd>⇧Return</kbd> disagree and say why · <kbd>?</kbd> all keys<br>
    A verdict says whether <b>you agree with the automated result</b> of that path, having watched it. Each build opens as it was after story ${s.review_build}. Reviews save to <code>${esc(S.file)}</code>.</div>`;
  renderBuilds();
}

async function go(i) {
  story = Math.max(0, Math.min(i, S.stories.length - 1)); cur = null; stopPlayer();
  await fetch(`/api/review/story/${sidNow()}`, {method: "POST"});
  status = {}; await poll(); await loadPaths();
  renderNav(); renderStory();
}

// ---------- the player ----------
let P = null;  // {key, idx, w, t, playing, speed, skipWaits, last, raf, waits, checks}

function stopPlayer() {
  if (P?.raf) cancelAnimationFrame(P.raf);
  if (P?.urls) Object.values(P.urls).forEach(u => URL.revokeObjectURL(u));
  P = null;
}

function flat() {  // every (key, idx) in page order, for j/k
  const sid = sidNow(), out = [];
  builds().forEach(b => paths(sid, b.key).forEach((_, j) => out.push({key: b.key, idx: j})));
  return out;
}

async function select(key, idx) {
  cur = {key, idx}; renderBuilds();
  document.querySelector(".prow.on")?.scrollIntoView({block: "nearest"});
  stopPlayer();
  const sid = sidNow(), p = paths(sid, key)[idx];
  if (!p) { $("player").innerHTML = `<section class="muted">This build has no recorded path here.</section>`; return; }
  $("player").innerHTML = `<section>Loading the recording…</section>`;
  const [wr, tasks] = await Promise.all([
    fetch(`/api/review/walkthrough/${sid}/${key}/${idx}`),
    tasksCache[`${sid}:${key}`] ? Promise.resolve(tasksCache[`${sid}:${key}`]) : fetch(`/api/review/tasks/${sid}/${key}`).then(r => r.json()),
  ]);
  tasksCache[`${sid}:${key}`] = tasks;
  if (!cur || cur.key !== key || cur.idx !== idx) return;  // moved on while loading
  const w = wr.ok ? await wr.json() : null;
  // Open on the first frame anyone sees, not on a blank screen.
  const first = w ? Math.min(...w.people.map(pp => pp.frames[0]?.[0] ?? Infinity), w.end) : 0;
  P = {key, idx, w, p, t: w ? Math.max(w.start, first) : 0, playing: false, speed: 1, skipWaits: true, last: 0, raf: 0, urls: {}, dragging: false};
  if (w) {
    P.waits = w.steps.filter(s => s.kind === "wait" && s.end - s.start > LONG_WAIT_MS).map(s => [s.start, s.end]);
    P.tl = timeline(w.start, w.end, P.waits, WAIT_SHOWN_MS);
    P.checks = w.steps.filter(s => s.kind === "check" || s.error);
    P.frameUrl = name => `/api/review/frame/${sid}/${key}/${idx}/${encodeURIComponent(name)}`;
    // Waits are skipped in playback, so a path's watchable length is without them.
    const watchable = w.end - w.start - P.waits.reduce((d, [a, b]) => d + b - a, 0);
    P.speed = defaultSpeed(watchable, SPEEDS, MIN_PLAY_MS);
  }
  renderPlayer(tasks);
  if (w) preloadFrames(P);
}

// Seek-bar position of a time and back (player.js), for the open path.
const pos = t => P.tl.pos(t), timeAt = frac => P.tl.timeAt(frac);

// Every frame of the path fetched and decoded up front, so scrubbing never waits on the network.
async function preloadFrames(p) {
  const names = [...new Set(p.w.people.flatMap(pp => pp.frames.map(f => f[1])))];
  let next = 0, done = 0;
  const one = async () => {
    while (next < names.length && P === p) {
      const name = names[next++];
      try {
        const blob = await (await fetch(p.frameUrl(name))).blob();
        const url = URL.createObjectURL(blob), img = new Image();
        img.src = url; await img.decode();
        if (P !== p) { URL.revokeObjectURL(url); return; }
        p.urls[name] = url;
      } catch (e) { /* shown from the server instead */ }
      done++;
      if ($("frames")) $("frames").textContent = done < names.length ? `frames ${done}/${names.length}` : "";
    }
  };
  await Promise.all(Array.from({length: FRAME_FETCHES}, one));
  if (P === p) show();
}

function renderPlayer(tasks) {
  const sid = sidNow(), {w, p, key, idx} = P;
  const anchors = anchorsOf(p.title);
  const v = review(sid, key, p.title) || {};
  const details = p.trace ? `/trace/index.html?trace=${encodeURIComponent(location.origin + "/recordings/" + p.trace)}` : "";
  const label = S.builds.find(b => b.key === key)?.label || "";
  const reqHtml = anchors.length ? anchors.map(a => {
      const req = S.stories[story].requirements.find(r => r.anchor === a);
      return req ? `<div class="req"><b>${esc(req.title)}</b> <span class="muted small">prd:${esc(a)} · story ${sid}</span>\n${esc(req.text)}</div>`
        : `<div class="req muted">prd:${esc(a)} is not an anchor in story ${sid}'s PRD</div>`;
    }).join("") : `<div class="req muted">this test names no PRD requirement</div>`;
  const stageHtml = !w ? `<div class="muted small">no trace for this path</div>` : `
    <div class="stage">${w.people.map((pp, i) => `<div class="pane"><div class="who">${esc(pp.label)}</div><div class="screen" style="aspect-ratio:${pp.width || 16}/${pp.height || 10}"><img id="img${i}" alt=""><span id="none${i}">not on screen yet</span></div></div>`).join("") || `<div class="muted small">no screen frames in this trace</div>`}</div>
    <div class="seek" id="seek">${P.waits.map(([a, b]) => `<div class="wait" style="left:${pos(a) * 100}%;width:${(pos(b) - pos(a)) * 100}%" title="waits ${((b - a) / 1000).toFixed(1)} s"></div>`).join("")}
      ${w.steps.map((s, i) => `<div class="tick ${s.error ? "bad" : s.kind === "check" ? "ok" : "act"}" data-tick="${i}" style="left:${pos(s.end) * 100}%" title="${esc(s.title)}"></div>`).join("")}<div class="head" id="head"></div></div>
    <div class="controls"><button id="play">▶ play</button>
      ${SPEEDS.map(x => `<button data-speed="${x}" class="${x === P.speed ? "on" : ""}">${x}×</button>`).join("")}
      <label><input type="checkbox" id="skipw" ${P.skipWaits ? "checked" : ""}> skip long waits</label>
      <span id="clock" class="muted"></span><span id="frames" class="muted"></span></div>`;
  const stepsHtml = !w ? "" : `<div class="steps" id="steps" tabindex="0" aria-label="Browser steps">${w.steps.map((s, i) => `<div class="step ${s.kind === "check" ? "check" : s.kind === "wait" ? "wait" : "act"}" data-s="${i}">
      <span class="${s.error ? "bad" : "ok"}">${s.kind === "check" || s.error ? (s.error ? "✗" : "✓") : ""}</span>
      <span>${esc(s.title)}${s.person != null && w.people.length > 1 ? ` <span class="muted">· ${esc(w.people[s.person].label)}</span>` : ""}</span>
      <span class="muted">${((s.end - w.start) / 1000).toFixed(1)}s</span>
      ${s.error ? `<div class="err">${esc(s.error.split("\n").filter(Boolean).slice(0, 3).join("\n"))}</div>` : ""}</div>`).join("")}
      ${w.error ? `<div class="step"><span class="bad">✗</span><span class="err" style="grid-column:2/-1">${esc(w.error)}</span></div>` : ""}</div>`;
  const t = tasks || {};
  const tasksHtml = `<details style="margin-top:8px"><summary>Tasks of this story in this build (the spec doesn't say which task implements this requirement)</summary>
    <table><tr><th>#</th><th>task</th><th>type</th><th>status</th><th>commits naming it</th></tr>
    ${(t.tasks || []).map(x => `<tr><td>${x.n}</td><td>${esc(x.title)}</td><td class="muted">${esc(x.kind)}</td><td class="st-${esc(x.status || "none")}">${esc(x.status || (t.status_recorded ? "—" : "not recorded"))}</td><td>${x.commits.length ? x.commits.map(esc).join("<br>") : `<span class="muted">none</span>`}</td></tr>`).join("")}</table>
    <div class="small muted" style="margin-top:6px">This build's commits for story ${sid}:</div>
    <ul class="small">${(t.commits || []).map(c => `<li><code>${esc(c.hash)}</code> ${esc(c.subject)}</li>`).join("") || `<li class="muted">none found</li>`}</ul></details>`;
  $("player").innerHTML = `<section>
    <div class="phead"><span class="auto ${esc(p.status)}">Automated: ${esc(p.status.toUpperCase())}</span><b>${esc(shortTitle(p.title))}</b>
      <span class="muted small">${esc(label)} · path ${idx + 1} of ${paths(sid, key).length}</span>
      ${details ? `<a class="small" href="${details}" target="_blank">details (trace viewer)</a>` : ""}${p.video ? ` <a class="small" href="/recordings/${encodeURI(p.video)}" target="_blank">video</a>` : ""}</div>
    ${reqHtml}
    <div class="pbody"><div>${stageHtml}</div><div>${stepsHtml}</div></div>
    <div class="verdict"><span class="small">Do you agree with <b>${esc(p.status)}</b>?</span>
      ${["agree", "disagree", "skip"].map(x => `<button class="${x} ${v.verdict === x ? "on" : ""}" data-pv="${x}">${x}</button>`).join("")}
      <input id="pnote" value="${esc(v.notes || "")}" placeholder="why — what the recording shows, what the test missed…"></div>
    ${tasksHtml}</section>`;
  if (w) {
    $("play").onclick = togglePlay;
    document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { P.speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", +x.dataset.speed === P.speed)); });
    $("skipw").onchange = e => P.skipWaits = e.target.checked;
    // Scrub: press and drag anywhere on the bar; pressing a tick goes to that step.
    const bar = $("seek"), at = e => { const r = bar.getBoundingClientRect(); return timeAt((e.clientX - r.left) / r.width); };
    bar.onpointerdown = e => {
      e.preventDefault();
      bar.setPointerCapture(e.pointerId);
      P.dragging = true;
      if (P.playing) togglePlay();
      const tick = e.target.dataset?.tick;
      seek(tick !== undefined ? w.steps[+tick].end : at(e));
    };
    bar.onpointermove = e => { if (P?.dragging) seek(at(e)); };
    bar.onpointerup = bar.onpointercancel = e => { if (P) P.dragging = false; bar.releasePointerCapture?.(e.pointerId); };
    document.querySelectorAll("[data-s]").forEach(el => el.onclick = () => seek(w.steps[+el.dataset.s].end));
  }
  document.querySelectorAll("[data-pv]").forEach(b => b.onclick = () => judge(b.dataset.pv));
  $("pnote").oninput = e => {
    const id = `${sid}:${key}:${p.title}`;
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => post(key, review(sid, key, p.title)?.verdict || "", e.target.value, p.title), NOTE_SAVE_MS);
  };
  if (w) show();
  focusPane();
}

function show() {
  const {w, t} = P;
  w.people.forEach((pp, i) => {
    const name = frameAt(pp.frames, t), img = $(`img${i}`), none = $(`none${i}`);
    if (!img) return;
    if (name) {
      const u = P.urls[name] || P.frameUrl(name);  // decoded up front; the server until then
      if (img.dataset.u !== u) { img.src = u; img.dataset.u = u; img.dataset.n = name; }
      img.style.display = ""; none.style.display = "none";
    }
    else { img.style.display = "none"; none.style.display = ""; }
  });
  if ($("head")) $("head").style.left = `${pos(t) * 100}%`;
  if ($("clock")) $("clock").textContent = `${((t - w.start) / 1000).toFixed(1)} s of ${((w.end - w.start) / 1000).toFixed(1)} s`;
  let curStep = -1;
  w.steps.forEach((s, i) => { if (s.start <= t + EPS_MS) curStep = i; });
  document.querySelectorAll("[data-s]").forEach(el => el.classList.toggle("cur", +el.dataset.s === curStep));
  if (P.playing || pane === "steps") document.querySelector(`[data-s="${curStep}"]`)?.scrollIntoView({block: "nearest"});
}

function seek(t) { if (!P?.w) return; P.t = Math.max(P.w.start, Math.min(t, P.w.end)); show(); }

function togglePlay() {
  if (!P?.w) return;
  P.playing = !P.playing;
  if (P.playing && P.t >= P.w.end - EPS_MS) P.t = P.w.start;
  $("play").textContent = P.playing ? "❚❚ pause" : "▶ play";
  P.last = performance.now();
  if (P.playing) P.raf = requestAnimationFrame(tick);
}

function tick(now) {
  if (!P?.playing) return;
  P.t += (now - P.last) * P.speed; P.last = now;
  if (P.skipWaits) for (const [a, b] of P.waits) if (P.t > a && P.t < b) P.t = b;
  if (P.t >= P.w.end) { P.t = P.w.end; P.playing = false; $("play").textContent = "▶ play"; }
  show();
  if (P.playing) P.raf = requestAnimationFrame(tick);
}

function stepCheck(dir) {
  if (!P?.w) return;
  const t = nextCheck(P.checks.map(s => s.end), P.t, dir, EPS_MS);
  if (t === null) return movePath(dir);   // off either end of the path: on to the next or previous one
  seek(t); document.querySelector(".step.cur")?.scrollIntoView({block: "nearest"});
}

// The next or previous path, carrying on into the next or previous story at either end.
async function movePath(dir) {
  const f = flat(), i = cur ? f.findIndex(x => x.key === cur.key && x.idx === cur.idx) : -1;
  const to = nextSpot(f.length, i, dir);
  if (to.path !== undefined) return select(f[to.path].key, f[to.path].idx);
  const next = story + to.story;
  if (next < 0 || next >= S.stories.length) return;
  await go(next);
  const g = flat();
  if (g.length) { const p = dir > 0 ? g[0] : g[g.length - 1]; select(p.key, p.idx); }
}

async function judge(v) {
  if (!P) return;
  const sid = sidNow(), note = $("pnote")?.value ?? review(sid, P.key, P.p.title)?.notes ?? "";
  if (!(await post(P.key, v, note, P.p.title))) return;
  document.querySelectorAll("[data-pv]").forEach(b => b.classList.toggle("on", b.dataset.pv === v));
  renderNav(); renderBuilds();
}

// ---------- building tabs, saving, reveal ----------
async function openTab(key) {
  const sid = sidNow(), name = `vidi-build-${key}`;  // one tab per build, reused across stories
  if (status[key]?.state === "running") { window.open(status[key].url, name); return; }
  const w = window.open("about:blank", name);  // open now, while this is still a user action
  const st = await (await fetch(`/api/review/open/${sid}/${key}`, {method: "POST"})).json();
  status[key] = st; renderBuilds();
  const wait = async () => {
    await poll();
    if (status[key]?.state === "running") { if (w) w.location = status[key].url; }
    else if (status[key]?.state !== "failed") setTimeout(wait, POLL_MS / 2);
  };
  wait();
}

async function post(key, verdict, notes, path = "") {
  const sid = sidNow();
  const r = await fetch("/api/review/set", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({story: sid, key, path, verdict, notes})});
  if (!r.ok) { $("saved").textContent = "NOT SAVED: " + (await r.text()); return false; }
  const row = review(sid, key, path);
  if (row) { row.verdict = verdict; row.notes = notes; } else S.reviews.push({story: sid, key, path, verdict, notes});
  $("saved").textContent = "saved " + new Date().toLocaleTimeString();
  return true;
}

async function reveal() {
  const r = await fetch(`/api/review/reveal/${sidNow()}`);
  const d = await r.json();
  $("rvout").textContent = r.ok ? d.map(x => `${String.fromCharCode(65 + x.key)} = ${x.setup} ${x.run}`).join(" · ") : d.error;
}

async function poll() {
  for (const s of await (await fetch(`/api/review/status/${sidNow()}`)).json()) status[s.key] = s.status;
}

// ---------- the keyboard layer (keyAction in player.js says what each key does) ----------
const KEYS = [
  ["Three panes", "stories · held-out tests · browser steps (the focused one has a ring)"],
  ["Tab · ⇧Tab Esc", "next pane · previous pane"],
  ["Stories: ↑ ↓", "previous / next story"],
  ["Stories: → Return", "into the story's held-out tests"],
  ["Tests: ↑ ↓", "previous / next held-out test"],
  ["Steps: ↑ ↓", "previous / next browser step"],
  ["Tests, steps: ← →", "scrub a second (⇧: a tenth)"],
  ["Space", "play / pause"],
  ["= -", "scrub a second forward / back (⇧: a tenth)"],
  [". ,", "next / previous frame"],
  ["1 … 9 · 0", "jump to 10% … 90% · the start"],
  ["Home End", "start / end"],
  ["> <", "faster / slower"],
  ["] [ · PgDn PgUp", "next / previous story, from any pane"],
  ["Return", "agree, and on to the next test"],
  ["⇧Return", "disagree, and write why"],
  ["a d s", "agree / disagree / skip (stay here)"],
  ["n", "write a note (Esc or Return to leave it)"],
  ["o", "open this build"],
  ["w", "skip long waits on / off"],
  ["?", "show / hide these keys"],
];

function toggleHelp(show = !$("help")) {
  if (!show) { $("help")?.remove(); return; }
  if ($("help")) return;
  const d = document.createElement("div");
  d.id = "help"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Keys");
  const keyCell = k => { const [where, keys] = k.includes(": ") ? k.split(": ") : ["", k];
    return (where ? `<span class="muted">${esc(where)}:</span> ` : "") + (keys === "Three panes" ? `<b>${esc(keys)}</b>` : keys.split(" ").map(x => x === "·" || x === "…" ? x : `<kbd>${esc(x)}</kbd>`).join(" ")); };
  d.innerHTML = `<div class="helpbox"><h2>Keys</h2><table>${KEYS.map(([k, what]) => `<tr><td>${keyCell(k)}</td><td>${esc(what)}</td></tr>`).join("")}</table>
    <div class="small muted">Press <kbd>?</kbd> or <kbd>Esc</kbd> to close.</div></div>`;
  d.onclick = e => { if (e.target === d) toggleHelp(false); };
  document.body.appendChild(d);
}

function stepAny(dir) {  // the next or previous browser step, whatever its kind
  if (!P?.w) return;
  const steps = P.w.steps;
  let i = -1;
  steps.forEach((st, j) => { if (st.start <= P.t + EPS_MS) i = j; });
  const j = Math.max(0, Math.min(steps.length - 1, i + dir));
  pause(); seek(steps[j].start + EPS_MS);
}

function pause() { if (P?.playing) togglePlay(); }

function setSpeed(dir) {
  if (!P) return;
  const i = SPEEDS.indexOf(P.speed), j = Math.max(0, Math.min(SPEEDS.length - 1, (i < 0 ? SPEEDS.indexOf(1) : i) + dir));
  P.speed = SPEEDS[j];
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", +x.dataset.speed === P.speed));
}

async function act(a) {
  switch (a.do) {
    case "none": return;
    case "pane":
      if (a.to === "tests" && !cur) { const f = flat(); if (f.length) await select(f[0].key, f[0].idx); }
      if (a.to === "steps" && !$("steps")) return;  // nothing playing yet
      pane = a.to; paneEl(pane)?.focus({preventScroll: true}); return;
    case "path": return movePath(a.dir);
    case "story": return go(story + a.dir);
    case "play": return togglePlay();
    case "check": return stepCheck(a.dir);
    case "step": return stepAny(a.dir);
    case "frame": { if (!P?.w) return; pause(); const t = nextFrame(P.w.people.map(pp => pp.frames), P.t, a.dir); if (t !== null) seek(t); return; }
    case "scrub": if (P?.w) { pause(); seek(P.t + a.ms); } return;
    case "jump": if (P?.w) { pause(); seek(a.frac >= 1 ? P.w.end : a.frac <= 0 ? P.w.start : timeAt(a.frac)); } return;
    case "speed": return setSpeed(a.dir);
    case "waits": if (P) { P.skipWaits = !P.skipWaits; if ($("skipw")) $("skipw").checked = P.skipWaits; } return;
    case "verdict":
      if (!P) return;
      await judge(a.v);
      if (a.note) $("pnote")?.focus();
      else if (a.next) return movePath(1);
      return;
    case "note": return $("pnote")?.focus();
    case "open": if (cur) openTab(cur.key); return;
    case "help": return toggleHelp();
    case "escape": return pause();
  }
}

document.addEventListener("keydown", e => {
  if (["TEXTAREA", "INPUT"].includes(e.target.tagName) && e.target.type !== "checkbox") {
    // In the note: Esc or Return leaves it (it saves as you type); everything else is typing.
    if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); e.target.blur(); }
    return;
  }
  if ($("help") && (e.code === "Escape" || (e.code === "Slash" && e.shiftKey))) { e.preventDefault(); toggleHelp(false); return; }
  const a = keyAction(e, pane);
  if (!a) return;
  e.preventDefault();  // Tab, Space, Return, arrows and the rest are ours here, not the focused button's
  act(a);
});

(async () => {
  S = await (await fetch("/api/review/state")).json();
  const want = new URLSearchParams(location.search);
  if (want.get("run") && !S.blind) {
    // The run may not be under review yet (the gallery adds finished, scored runs with a bundle each minute).
    for (let i = 0; ; i++) {
      const b = S.builds.find(x => x.setup === want.get("setup") && x.run === want.get("run"));
      if (b) { focus = b.key; break; }
      if (i >= FOCUS_TRIES) break;
      $("main").textContent = `Waiting for ${want.get("setup")} · ${want.get("run")} to be added to the review…`;
      await new Promise(r => setTimeout(r, FOCUS_RETRY_MS));
      S = await (await fetch("/api/review/state")).json();
    }
  }
  const one = focus !== null ? S.builds.find(b => b.key === focus) : null;
  $("mode").innerHTML = one
    ? `judging <b>${esc(one.label)}</b>${S.builds.length > 1 ? ` · <a href="/review">all ${S.builds.length} builds</a>` : " (the only one under review)"} · <kbd>?</kbd> keys`
    : (want.get("run") && !S.blind ? `<span class="fail">${esc(want.get("setup"))} · ${esc(want.get("run"))} isn't under review (it must be finished, scored and have its workspace.bundle, in ${esc(S.family)})</span> · ` : "")
      + `${S.builds.length} ${esc(S.family)} builds · ${S.blind ? "blind (letters are shuffled each session)" : "labelled"} · <kbd>?</kbd> keys`;
  await go(0);
  setInterval(async () => {
    const before = JSON.stringify([status, builds().map(b => pathsCache[`${sidNow()}:${b.key}`]?.state)]);
    await poll(); await loadPaths();
    // The list only: the player keeps playing.
    if (before !== JSON.stringify([status, builds().map(b => pathsCache[`${sidNow()}:${b.key}`]?.state)])) { renderNav(); renderBuilds(); }
  }, POLL_MS);
})();
</script>
</body>
</html>
