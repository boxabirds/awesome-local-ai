[package]
name = "vidi-gallery"
version = "0.1.0"
edition = "2021"
description = "Review every Vidi build side by side: scores, judging and cost, and each final build running in its own labelled window."
publish = false

[[bin]]
name = "vidi-gallery"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "net", "signal"] }

[profile.release]
strip = true
lto = "thin"
