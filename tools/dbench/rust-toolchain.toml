# The one place the Rust version is set, for local builds and for CI alike.
#
# rustup reads this file for every cargo command run in tools/dbench and installs the toolchain on
# first use. CI (.github/workflows/checks.yml) reads `channel` from here and uses it for every Rust
# check, the other crates under tools/ included, so a new stable release (with new clippy lints)
# can't turn a passing commit red. To move to a newer Rust: change `channel`, run the checks, commit.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy"]
# build-linux.sh cross-builds dbench for the Linux bench machines from a Mac.
targets = ["x86_64-unknown-linux-gnu"]
