# String literals in benchmarks/spec-bench/harness that have the shape of a file name
# ([A-Za-z0-9_.-]+ then .json .jsonl .md .txt .log .gz or .bundle) but are not files written under a run directory.
# The classification check (collect.rs, mod name_check, lake.allowlist.file_name_check) reads the harness sources, takes
# every such literal, removes the ones named here, and requires the rest to be classified as collected or not collected.
# A literal belongs here only with a reason; a literal that IS a run file never does.
#
# Scanned at f0066f55b41e80e41b8a4b86840e081ab5addda6 with the Python ast (real string constants of *.py, tests
# excluded) and a pattern over *.sh: 87 distinct literals. 39 are run files and are classified by the collector's
# rules; the rest are below.

# --- files inside the agent's workspace or in the held-out pack, not in the run directory ---
[[literal]]
name = "PROGRESS.md"
reason = "the agent's progress file inside its workspace (progress_file.py); the workspace is not collected"
[[literal]]
name = "README.md"
reason = "seed file of the agent's fresh workspace (drive.py setup_workspace); the workspace is not collected"
[[literal]]
name = "story.md"
reason = "a story's text inside the pack and the workspace spec folder (pack.py, drive.py)"
[[literal]]
name = "tasks.md"
reason = "a file the sandbox proof and the agent write inside the workspace (drive.py, prove_sandbox.py)"
[[literal]]
name = "package.json"
reason = "the agent project's package manifest, read by the gates inside the workspace"
[[literal]]
name = "package-lock.json"
reason = "the agent project's lock file, read by the gates inside the workspace"
[[literal]]
name = "bench.json"
reason = "a pack's description in the pack checkout (pack.py, setup-node.sh)"
[[literal]]
name = "GRADING.md"
reason = "the pack's grading document, copied into a judge package (grading_package.py)"
[[literal]]
name = "scope.json"
reason = "a pack's scope file, read by the grading package and the judge preparation"

