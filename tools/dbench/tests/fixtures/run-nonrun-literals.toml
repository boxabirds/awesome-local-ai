# --- Corpus names that no writer in the harness sources explains ---------------------------------------------------
# The task says these are listed for the owner and not silently kept. Each is a name present in the corpus
# (run-file-names.txt) for which no literal in the sources above writes it under a run directory, or a name the
# design's 42 rules do not cover. The collector's classification has no rule for them yet, so the build check
# (E-CLASS-UNLISTED) cannot pass until the owner decides: collect them (a new rule) or leave them out (not collected).
# They matter beyond this story: story 16's parity check compares every tracked file with the lake.

[[unexplained]]
name = "prompts/story-NN.md"
where = "the hand-written reference record benchmarks/reference/vidi/opus-5.5/run-1 (tracked in git)"
note = "a record file of an old-layout reference run; no writer in the sources"
[[unexplained]]
name = "agent-reports/story-NN.md"
where = "the same reference record"
note = "a record file of an old-layout reference run; no writer in the sources"
[[unexplained]]
name = "OMITTED.txt"
where = "the same reference record"
note = "a note in an old-layout reference run; no writer in the sources"
[[unexplained]]
name = "README.md (run level)"
where = "the same reference record"
note = "a run-level README, not the workspace seed file; no writer for it in the sources"
[[unexplained]]
name = "accept-summary.json, accept-final.json, accept-final-summary.json (run level, no stories/NN)"
where = "the same reference record and one older node run"
note = "the design's rules name these only under stories/NN/; publicise.py writes them with a story prefix"
[[unexplained]]
name = "egress.jsonl (a real file in the run directory)"
where = "one tracked combination run (gufo-opencode v2-gufoopencode-r1)"
note = "the design makes egress.jsonl a virtual name served from the egress folder; here it is also a real tracked file"
[[unexplained]]
name = "stories/NN/gate.original.json"
where = "one run on one node"
note = "no writer in the current harness sources; an older release wrote it"
[[unexplained]]
name = "flow-counts.json"
where = "not yet written; story 4 adds it"
note = "the corpus cannot contain it yet; the design lists it as a collected whole-file record"

