# --- Corpus names the design's 42 rules did not cover -------------------------------------------------------------
# The classification check found these names in the recorded run directories (run-file-names.txt) with no rule to
# accept them. Every tracked file of a run must be in the lake before the run leaves git (story 16 compares them), so
# they are collected, by LEGACY_RECORDS in collect.rs, a list kept beside the design's 42 rules. The owner decides
# whether they stay in the lake or are left out; until then they are collected, which loses nothing.
#
#   prompts/story-NN.md, agent-reports/story-NN.md, OMITTED.txt, README.md (run level), accept-summary.json,
#   accept-final.json and accept-final-summary.json at the run level, stories/NN/gate.original.json
#
# They come from the hand-written reference record benchmarks/reference/vidi/opus-5.5/run-1 (an older layout), and
# gate.original.json from one run on one node with no writer in the current sources. A tracked egress.jsonl in the run
# directory of one combination run is served too: the egress name falls back to a file of that name in the run.

# The fourth node was unreachable when the corpus was captured (no answer from its dbench server or ssh), so the
# node listings cover three of the four nodes; the source scan is the guard for names only that node writes.
