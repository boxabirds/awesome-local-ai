[package]
name = "agent-sandbox"
version = "0.1.0"
edition = "2021"
description = "Least-privilege sandbox for a benchmark's coding agent: deny by default, one policy, enforced by Seatbelt on macOS and bubblewrap on Linux."
publish = false

[[bin]]
name = "agent-sandbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
