[package]
name = "power-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
plist = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tapo = "0.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "process", "sync"] }
