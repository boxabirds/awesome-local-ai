[package]
name = "anthropic-token-counter"
version = "0.1.0"
edition = "2021"
description = "Counts the output tokens of a Claude Code story two ways, Anthropic's count_tokens endpoint and the Xenova/claude-tokenizer vocabulary, and sets both beside the total Claude Code reported."
publish = false

[[bin]]
name = "anthropic-token-counter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
