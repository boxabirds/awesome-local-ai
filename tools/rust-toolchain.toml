# The one place the Rust version is set.
#
# rustup reads this file for every cargo command run in tools/dbench and installs the toolchain on
# first use, so a new stable release (with new clippy lints) can't fail a commit that passed before.
# To move to a newer Rust: change `channel`, run the checks, commit.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy"]
# build-linux.sh cross-builds dbench for the Linux bench machines from a Mac.
targets = ["x86_64-unknown-linux-gnu"]
