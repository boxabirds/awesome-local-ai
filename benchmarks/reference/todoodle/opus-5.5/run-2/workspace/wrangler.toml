name = "todoodle"
main = "apps/api/src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Base environment = local development and tests. Never points at real data.
[vars]
ENVIRONMENT = "local"

[[d1_databases]]
binding = "DB"
database_name = "todoodle-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# WorkspaceRoom Durable Object (story 4): one room per workspace fans out live events over
# hibernatable WebSockets. It holds no data of record. Bindings are not inherited by
# environments, so staging and production repeat them.
[[durable_objects.bindings]]
name = "WORKSPACE_ROOM"
class_name = "WorkspaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRoom"]

# APP_VERSION, GIT_SHA and DEPLOYED_AT are injected by scripts/deploy.ts via
# `wrangler deploy --var`, never stored here.

[env.staging]
name = "todoodle-staging"
logpush = true
vars = { ENVIRONMENT = "staging" }
# Fill database_id after `wrangler d1 create todoodle-staging` (see README).
d1_databases = [
  { binding = "DB", database_name = "todoodle-staging", database_id = "REPLACE_WITH_STAGING_D1_ID", migrations_dir = "migrations" },
]

[[env.staging.durable_objects.bindings]]
name = "WORKSPACE_ROOM"
class_name = "WorkspaceRoom"

[env.staging.observability.logs]
enabled = true
# Invocation logs record request metadata (including headers such as Cookie, which carries
# workspace secrets). Off: only our own sanitised console lines are kept (story 2, no-leak).
invocation_logs = false

[env.production]
name = "todoodle-production"
logpush = true
vars = { ENVIRONMENT = "production" }
# Fill database_id after `wrangler d1 create todoodle-production` (see README).
d1_databases = [
  { binding = "DB", database_name = "todoodle-production", database_id = "REPLACE_WITH_PRODUCTION_D1_ID", migrations_dir = "migrations" },
]

[[env.production.durable_objects.bindings]]
name = "WORKSPACE_ROOM"
class_name = "WorkspaceRoom"

[env.production.observability.logs]
enabled = true
# Invocation logs record request metadata (including headers such as Cookie, which carries
# workspace secrets). Off: only our own sanitised console lines are kept (story 2, no-leak).
invocation_logs = false
