# Every check a harness release must pass, on every change to code.
#
# The checks themselves are not listed here: they are tools/dbench/checks.toml, run by
# `dbench harness-release --check-only`, the same command (without --check-only) that makes a
# release. This file only installs what they need.
#
# The paths below are the `paths` of checks.toml, one line each, under both triggers (a dbench unit
# test fails if they differ). Benchmark results (the rest of combinations/**, and
# benchmarks/reference/**) are committed dozens of times a day and must not start a run.
name: checks

on:
  push:
    paths:
      - "benchmarks/spec-bench/**"
      - "benchmarks/vidi/**"
      - "benchmarks/todoodle/**"
      - "benchmarks/perf/**"
      - "tools/**"
      - "tests/**"
      - "lib/**"
      - ".github/**"
      - "*.sh"
      - "combinations/*/*/*/*/*/*/config.sh"
      - "combinations/*/*/*/*/*/*/profiles.tsv"
      - "combinations/*/*/*/*/*/*/help.txt"
  pull_request:
    paths:
      - "benchmarks/spec-bench/**"
      - "benchmarks/vidi/**"
      - "benchmarks/todoodle/**"
      - "benchmarks/perf/**"
      - "tools/**"
      - "tests/**"
      - "lib/**"
      - ".github/**"
      - "*.sh"
      - "combinations/*/*/*/*/*/*/config.sh"
      - "combinations/*/*/*/*/*/*/profiles.tsv"
      - "combinations/*/*/*/*/*/*/help.txt"

permissions:
  contents: read

# A newer commit on the same ref replaces a run still in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Under the runner's temp directory: each check's full output, kept when a check fails.
  CHECK_LOGS: check-logs
  # The one place the Rust version is set (its `channel`), for local builds too.
  RUST_TOOLCHAIN_FILE: tools/dbench/rust-toolchain.toml
  # The harness tests that run the real sandbox fail, rather than skip, if it is missing here (conftest.py).
  SPEC_BENCH_REQUIRE_SANDBOX: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The pinned Rust, never "stable": a new release brings new clippy lints, and would fail a commit
      # that passed the day before. RUSTUP_TOOLCHAIN makes every later cargo (all three crates) use it.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' "$RUST_TOOLCHAIN_FILE")"
          [ -n "$channel" ] || { echo "no channel in $RUST_TOOLCHAIN_FILE" >&2; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/dbench
            tools/vidi-gallery
            tools/power-collector

      # The agent's sandbox on Linux is bubblewrap, which needs unprivileged user namespaces; Ubuntu 24.04
      # restricts those through AppArmor. Least privilege (CLAUDE.md): the AppArmor profile gives them to
      # bwrap alone, where the sysctl kernel.apparmor_restrict_unprivileged_userns=0 would give them to
      # every program. The last line proves the sandbox starts, before any test needs it.
      - name: Install the sandbox (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap
          bwrap --bind / / --dev-bind /dev /dev true

      # The harness tests: uv for Python; node, npm and npx for the end-to-end self-test.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The benchmarker tests: bun, its packages, and Playwright's chromium for the end-to-end ones.
      - uses: oven-sh/setup-bun@v2
      - name: Install benchmarker packages
        working-directory: tools/benchmarker
        run: bun install --frozen-lockfile
      - name: Install Playwright's chromium
        working-directory: tools/benchmarker
        run: bunx playwright install --with-deps chromium

      - name: Build dbench
        working-directory: tools/dbench
        run: cargo build

      - name: Run every check
        run: tools/dbench/target/debug/dbench harness-release --check-only --log-dir "$RUNNER_TEMP/$CHECK_LOGS"

      - name: Keep each check's full output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: ${{ runner.temp }}/${{ env.CHECK_LOGS }}
          if-no-files-found: ignore
