[[entry]]
language = "shell"
file = "scripts/cutsh.sh"
function = "publish_run"
classes = ["C"]
[[entry.cut]]
anchor = 'vcs add "$path"'
lines = 2
why = "runs the version-control add and takes its status"
[[entry.cut.uses]]
anchor = 'echo "ok:$path"'
[[entry.cut.guards]]
anchor = "if [[ $done -ne 0 ]]; then"
lines = 4
[[entry.cut]]
anchor = 'vcs amend "$path"'
lines = 2
why = "runs the version-control amend and takes its status"
[[entry.cut.uses]]
anchor = 'echo "ok:$path"'
[[entry.cut.guards]]
anchor = "if [[ $done -ne 0 ]]; then"
lines = 4
