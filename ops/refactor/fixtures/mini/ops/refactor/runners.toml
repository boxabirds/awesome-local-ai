[python]
dir = "py"
command = ["uv", "run", "--quiet", "--with", "pytest", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"]

[rust]
dir = "rs"
command = ["cargo", "test", "--workspace", "--", "--list"]

[typescript]
dir = "ts"
command = ["bun", "x", "vitest", "list", "--json"]

[shell]
glob = "tests/*-test.sh"

[python.coverage]
format = "coverage-py"
command = ["uv", "run", "--quiet", "--with", "pytest", "--with", "pytest-cov", "pytest", "-q", "-p", "no:cacheprovider",
           "--cov=.", "--cov-branch", "--cov-report=json:{out}"]

[rust.coverage]
format = "llvm-cov"
command = ["cargo", "+nightly", "llvm-cov", "--workspace", "--json", "--branch", "--output-path", "{out}"]

[typescript.coverage]
format = "vitest-summary"
command = ["bun", "x", "vitest", "run", "--coverage.enabled", "--coverage.provider=v8", "--coverage.reporter=json-summary",
           "--coverage.reportsDirectory={outdir}"]
file = "coverage-summary.json"
