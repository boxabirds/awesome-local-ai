# The mini project has no git in it, so its touched functions are named, not matched.
[sources]
python = ["py/minipy/*.py"]
rust = ["rs/mini/src/*.rs"]
typescript = ["ts/src/core.ts"]
shell = []
exclude = ["test_*.py", "conftest.py", "*.test.ts", "__init__.py"]

[classes.A]
patterns = []
[classes.B]
patterns = []
[classes.C]
patterns = []
[classes.D]
patterns = []
[classes.E]
patterns = []
[classes.W]
functions = []

[named]
A = ["py/minipy/core.py::run_dir"]
B = ["rs/mini/src/lib.rs::count_lines"]
C = ["py/minipy/core.py::record", "ts/src/core.ts::titleOf"]
