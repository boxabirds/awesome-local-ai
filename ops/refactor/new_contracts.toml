# The contract areas of the PRD (story 1, method.new_contracts): every area needs at least one new test, and that test
# must be seen to fail before the reimplementation (refactor.py fates). Contracts are added by the stories that build them.

[areas]
data_root = "the data root resolution"
run_id_goldens = "the run identity goldens in four languages"
allow_list = "the extended collection list and its file-name test"
lake_ingest = "the lake-based ingest"
lake_readers = "the lake-reading benchmarker, gallery and monitor"
job_inputs = "the job inputs directory"
export_step = "the export step"
lake_full_record = "the lake takes the full record of a run (story 5): the rules, the not-collected list, the file-name check"
lake_blob = "large files reach the lake whole, resumed and checked (story 5)"
lake_reference = "a reference model's run is collected into the reference folder, records only (story 5)"
lake_completeness = "a run is complete only when everything is held to its end (story 5)"
lake_space = "the collector holds, once, when the lake's disk is nearly full (story 5)"

