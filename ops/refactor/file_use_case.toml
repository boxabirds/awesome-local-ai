# One use case per test file (docs/designs/operational-data-separation.md, "Refactoring method", step 1): the decision behind
# assignments.toml, which was written from it once (12 Oct 2026) by a script outside the tool. assignments.toml is the record the
# tool reads; this file explains it, and a new test file is mapped here and assigned there.
# Python test ids are written with their folder: benchmarks/spec-bench/harness/<file>.

