# The component groups of the epic, in the cutover order. A site belongs to the one group whose patterns take its file;
# a protecting test (one that failed in reports/deletion.json) is listed under the one group whose sites it needs;
# a group with no site gives an empty_reason. `epic-groups check` makes the grouping complete and exclusive.
#
# Draft generated by `epic-groups propose --toml` over the touched set of 16 Oct 2026 (112 entries). Four sites match no default
# rule, so `epic-groups check` reports them as E-SITE-UNGROUPED until the owner places them (add a pattern to a group, or a new group):
#   tools/anthropic-token-counter/src/corpus.rs::build
#   tools/anthropic-token-counter/src/corpus.rs::tracked
#   tools/anthropic-token-counter/src/main.rs::<module>
#   tools/dbench/src/analytics/mod.rs::purge_references
# The tests lists are empty: they are filled from reports/deletion.json once the deletion report has passed.

[[group]]
name = "dbench ingest and collector"
order = 1
patterns = ["tools/dbench/src/collect.rs", "tools/dbench/src/collector.rs", "tools/dbench/src/server.rs", "tools/dbench/src/job.rs", "tools/dbench/src/runner.rs", "tools/dbench/src/progress.rs", "tools/dbench/src/node.rs", "tools/dbench/src/harness.rs", "tools/dbench/src/release.rs", "tools/dbench/src/ingest/**"]
tests = []

[[group]]
name = "the engine"
order = 2
patterns = ["tools/benchmarker/server/sources.ts", "tools/benchmarker/server/domain.ts", "tools/benchmarker/server/faults.ts", "tools/benchmarker/server/runNotes.ts"]
tests = []

[[group]]
name = "the benchmarker web forwarder"
order = 3
patterns = ["tools/benchmarker/**"]
except = ["tools/benchmarker/server/sources.ts", "tools/benchmarker/server/domain.ts", "tools/benchmarker/server/faults.ts", "tools/benchmarker/server/runNotes.ts"]
tests = []

[[group]]
name = "the gallery"
order = 4
patterns = ["tools/vidi-gallery/src/**"]
tests = []

[[group]]
name = "the monitor"
order = 5
patterns = ["ops/monitor/**"]
tests = []

[[group]]
name = "harness offline tools"
order = 6
patterns = ["benchmarks/spec-bench/harness/annotate.py", "benchmarks/spec-bench/harness/history.py", "benchmarks/spec-bench/harness/claims.py", "benchmarks/spec-bench/harness/judge.py", "benchmarks/spec-bench/harness/judge_prep.py", "benchmarks/spec-bench/harness/judge_collect.py", "benchmarks/spec-bench/harness/grading_package.py", "benchmarks/spec-bench/harness/logscan.py", "benchmarks/spec-bench/harness/rescore.py", "benchmarks/spec-bench/harness/import_run.py"]
tests = []

[[group]]
name = "harness record path"
order = 7
patterns = ["benchmarks/spec-bench/harness/*.py"]
except = ["benchmarks/spec-bench/harness/annotate.py", "benchmarks/spec-bench/harness/history.py", "benchmarks/spec-bench/harness/claims.py", "benchmarks/spec-bench/harness/judge.py", "benchmarks/spec-bench/harness/judge_prep.py", "benchmarks/spec-bench/harness/judge_collect.py", "benchmarks/spec-bench/harness/grading_package.py", "benchmarks/spec-bench/harness/logscan.py", "benchmarks/spec-bench/harness/rescore.py", "benchmarks/spec-bench/harness/import_run.py"]
tests = []

[[group]]
name = "node setup"
order = 8
patterns = ["**/*.sh"]
tests = []
