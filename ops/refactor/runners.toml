# The four runners the tool lists tests from (task 1.1): the folder each runs in and the command that lists its tests.
# The python command carries the same --with packages as the "harness unit suite" check in tools/dbench/checks.toml.

[python]
dir = "benchmarks/spec-bench/harness"
command = [
  "uv", "run", "--quiet",
  "--with", "pytest", "--with", "hypothesis", "--with", "httpx",
  "--with", "uvicorn", "--with", "starlette", "--with", "fastapi",
  "pytest", "--collect-only", "-q", "-p", "no:cacheprovider",
]

[rust]
dir = "tools"
command = ["cargo", "test", "--workspace", "--", "--list"]

[typescript]
dir = "tools/benchmarker"
command = ["bun", "x", "vitest", "list", "--json"]

[shell]
glob = "tests/*-test.sh"

# How check-coverage runs each suite under its coverage tool. "{out}" is the file the tool writes its JSON to, "{outdir}"
# the folder for a tool that names its own file (then "file" says which one to read).

[python.coverage]
command = [
  "uv", "run", "--quiet",
  "--with", "pytest", "--with", "pytest-cov", "--with", "hypothesis", "--with", "httpx",
  "--with", "uvicorn", "--with", "starlette", "--with", "fastapi",
  "pytest", "-q", "-p", "no:cacheprovider", "--cov=.", "--cov-branch", "--cov-report=lcov:{out}",
]

[rust.coverage]
command = ["cargo", "+nightly", "llvm-cov", "--workspace", "--lcov", "--branch", "--output-path", "{out}"]

# Needs @vitest/coverage-v8 in tools/benchmarker/package.json (task 1.28).
[typescript.coverage]
command = ["bun", "x", "vitest", "run", "--coverage.enabled", "--coverage.provider=v8", "--coverage.reporter=lcovonly", "--coverage.reportsDirectory={outdir}"]
file = "lcov.info"

[shell.coverage]
format = "kcov"
file = "kcov-merged/coverage.json"

# How run-suites runs each suite with its result output on, for report-deletion (and the whole-suite-green move).
# {out} is the file under ops/refactor/reports. cargo prints its json on stdout, which run-suites saves; its json test output
# is unstable, so it runs on the nightly toolchain. The python junit family must be xunit1 so a test carries its file.

[python.results]
format = "junit"
command = [
  "uv", "run", "--quiet",
  "--with", "pytest", "--with", "hypothesis", "--with", "httpx",
  "--with", "uvicorn", "--with", "starlette", "--with", "fastapi",
  "pytest", "-q", "-p", "no:cacheprovider", "-o", "junit_family=xunit1", "--junitxml={out}",
]

[rust.results]
format = "cargo-json"
command = ["cargo", "+nightly", "test", "--workspace", "--", "-Z", "unstable-options", "--format", "json"]

[typescript.results]
format = "vitest-json"
command = ["bun", "x", "vitest", "run", "--reporter=json", "--outputFile={out}"]

[shell.results]
format = "shell-exit"

# Which tests touch the touched set is learned once, from a Python run with a coverage context per test (measure-touch, slow);
# the register then keeps those. {out} is where `coverage json` writes. The data file goes to reports/ (COVERAGE_FILE).
[python.touch]
command = [
  "uv", "run", "--quiet",
  "--with", "pytest", "--with", "pytest-cov", "--with", "hypothesis", "--with", "httpx",
  "--with", "uvicorn", "--with", "starlette", "--with", "fastapi",
  "pytest", "-q", "-p", "no:cacheprovider", "--cov=.", "--cov-branch", "--cov-context=test", "--cov-report=",
]
json_command = ["uv", "run", "--quiet", "--with", "coverage", "coverage", "json", "--show-contexts", "-o", "{out}"]

# The monitor's own tests (U7 is one of the fourteen use cases and its code is in the touched set).
[python-monitor]
dir = "ops/monitor"
command = ["uv", "run", "--quiet", "--with", "pytest", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"]

[python-monitor.coverage]
command = ["uv", "run", "--quiet", "--with", "pytest", "--with", "pytest-cov", "pytest", "-q", "-p", "no:cacheprovider", "--cov=.", "--cov-branch", "--cov-report=lcov:{out}"]

[python-monitor.results]
format = "junit"
command = ["uv", "run", "--quiet", "--with", "pytest", "pytest", "-q", "-p", "no:cacheprovider", "-o", "junit_family=xunit1", "--junitxml={out}"]

[python-monitor.touch]
command = ["uv", "run", "--quiet", "--with", "pytest", "--with", "pytest-cov", "pytest", "-q", "-p", "no:cacheprovider", "--cov=.", "--cov-branch", "--cov-context=test", "--cov-report="]
json_command = ["uv", "run", "--quiet", "--with", "coverage", "coverage", "json", "--show-contexts", "-o", "{out}"]
