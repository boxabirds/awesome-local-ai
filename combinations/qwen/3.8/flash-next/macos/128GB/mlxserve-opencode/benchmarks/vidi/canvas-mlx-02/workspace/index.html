<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A board's address is the only thing keeping it private until permissions
      arrive, so it must never be handed to whoever is on the other side of a
      link. no-referrer covers the whole document, including the board page.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>vidi6</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
